services:
  - type: web
    name: minsouah-immobilier-cy30
    runtime: static
    buildCommand: npm install && NODE_OPTIONS=--max-old-space-size=1536 npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 20
    # ── Cache control ─────────────────────────────────────────────────────
    # index.html (and any HTML) must NEVER be cached: it references the
    # content-hashed JS/CSS files of the CURRENT build. If the browser keeps
    # an old index.html, it asks for old /assets/*.js files that no longer
    # exist → the SPA rewrite serves index.html (HTML) in their place → the
    # app fails to boot and the user is bounced back to the login page after
    # every deploy. Hashed assets, on the other hand, are safe to cache
    # forever because their filename changes whenever their content changes.
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    # ── En-têtes de sécurité ──────────────────────────────────────────────
    # ATTENTION : constaté en production le 2026-11-09, les en-têtes de ce
    # fichier ne sont PAS appliqués (le service a été créé depuis le tableau de
    # bord Render, pas en Blueprint). Les recopier dans Render → service →
    # Settings → Headers, ou relier le service à ce Blueprint.
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # CSP en mode « Report-Only » d'abord : les violations apparaissent dans
      # la console du navigateur sans rien bloquer. Après une semaine sans
      # violation sur tous les écrans, renommer en Content-Security-Policy.
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://images.unsplash.com https://i.ibb.co; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://*.firebaseapp.com https://emailvalidation.abstractapi.com https://api.imgbb.com; frame-src 'self' https://*.firebaseapp.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
