services:
  # ─── Backend NestJS ────────────────────────────────────────────
  - type: web
    name: minsouah-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: minsouah-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: minsouah-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false  # à renseigner manuellement après déploiement du frontend

  # ─── Frontend Vite (site statique) ────────────────────────────
  - type: web
    name: minsouah-app
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false  # à renseigner : https://minsouah-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ─── Redis ─────────────────────────────────────────────────────
  - type: redis
    name: minsouah-redis
    plan: free
    maxmemoryPolicy: noeviction

databases:
  # ─── PostgreSQL ─────────────────────────────────────────────────
  - name: minsouah-db
    plan: free
    databaseName: minsouah
    user: minsouah
