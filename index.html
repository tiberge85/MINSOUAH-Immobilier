<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minsouah — L'immobilier réinventé pour vous</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Filet de sécurité anti-cache périmé ─────────────────────────────────
         Après un déploiement, un navigateur qui a gardé en cache un ancien
         index.html peut demander un fichier /assets/*.js qui n'existe plus.
         Le serveur renvoie alors index.html (HTML) à la place du JS → l'app
         ne démarre pas et l'utilisateur retombe sur la page de connexion.
         Ici on détecte cet échec de chargement du bundle et on force UN SEUL
         rechargement propre pour récupérer la version courante. */
      (function () {
        var GUARD = '__minsouah_stale_reload__';
        function recover() {
          try {
            if (!sessionStorage.getItem(GUARD)) {
              sessionStorage.setItem(GUARD, '1');
              location.reload();
            }
          } catch (e) { /* ignore */ }
        }
        window.addEventListener('error', function (e) {
          var el = e && e.target;
          // Échec de chargement d'un script/lien du bundle applicatif
          if (el && el.tagName && el.src && String(el.src).indexOf('/assets/') !== -1) {
            recover();
            return;
          }
          // Erreur de parsing d'un module (HTML servi à la place du JS)
          var msg = (e && e.message) || '';
          if (/Unexpected token|failed to fetch dynamically|import|module/i.test(msg)) {
            recover();
          }
        }, true);
        // L'app a démarré correctement : on libère le garde-fou.
        window.addEventListener('load', function () {
          setTimeout(function () {
            try { sessionStorage.removeItem(GUARD); } catch (e) { /* ignore */ }
          }, 4000);
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
