name: Deploy Backend (Render)

on:
  push:
    branches: [main]
    paths:
      - 'server/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -s -X POST \
            "https://api.render.com/deploy/${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" \
            | jq .
